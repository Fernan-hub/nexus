[project]
name = "nexus"
version = "0.1.0"
description = "Nexus is a framework which simplifies the analysis of electrophysiology data"
authors = [
    {name = "Fernan-hub",email = "fangelesbenavides@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "neo (>=0.14.4,<0.15.0)",
    "elephant (>=1.1.1,<2.0.0)",
    "infomeasure (>=0.5.1,<0.6.0)",
    "pandas (>=2.2,<3.0)",
    "matplotlib (>=3.9,<4.0)",
    "seaborn (>=0.13,<0.14)",
    "networkx (>=3.0,<4.0)",
    "pynwb (>=2.0,<4.0)"
]

[dependency-groups]
dev = [
    "mypy (>=1.19.1,<2.0.0)",
    "flake8 (>=7.0.0,<8.0.0)"
]
test = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-cov (>=5.0.0,<6.0.0)",
    "genbadge[coverage] (>=1.1.0,<2.0.0)"
]


[tool.coverage.run]
source = ["nexus"]
omit = [
    "nexus/protocols.py",
    "nexus/types.py",
    "nexus/annotation/interfaces.py",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "@overload",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
